name: Build and publish résumé

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            poppler-utils \
            qpdf

      - name: Build and validate résumé and CV
        run: make check

      - name: Upload résumé and CV PDFs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resume-documents
          path: |
            build/resume.pdf
            build/cv.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: latex-build-diagnostics
          path: |
            build/resume.log
            build/resume.fdb_latexmk
            build/cv.log
            build/cv.fdb_latexmk
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download built PDFs
        uses: actions/download-artifact@v8.0.2
        with:
          name: resume-documents
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
